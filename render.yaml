services:
  - type: web
    name: gram-pulse
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server/deploy.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: UPLOAD_STORAGE
        value: database
      - key: SEED_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gram-pulse-db
          property: connectionString

databases:
  - name: gram-pulse-db
    plan: free
    region: singapore
    databaseName: gram_pulse
    user: gram_pulse
    ipAllowList: []
